# CI/CD for Terraform.
#
#   Pull request  -> validate (fmt, tflint, tests, checkov) -> plan dev & prod,
#                    plan posted as a PR comment
#   Merge to main -> validate -> plan -> apply dev -> apply prod (needs approval)
#
# Auth uses GitHub OIDC (no AWS keys stored in GitHub). Repo secrets needed:
#   AWS_ROLE_ARN     - output "github_actions_role_arn" from bootstrap
#   TF_STATE_BUCKET  - output "state_bucket_name" from bootstrap

name: terraform

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request an OIDC token for AWS
  pull-requests: write # lets the job comment the plan on the PR

# Never run two pipelines against the same state at once.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "~1.13"
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Validate & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Unit tests (network module, mocked - no AWS calls)
        working-directory: modules/network
        run: |
          terraform init -input=false
          terraform test

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: checkov (security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true # report findings but don't block (learning project)

  plan:
    name: Plan (${{ matrix.env }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write backend.hcl
        working-directory: .
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ secrets.TF_STATE_BUCKET }}"
          region       = "${{ env.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: terraform init
        run: terraform init -input=false -backend-config=../../backend.hcl

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan -detailed-exitcode > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes, anything else = real failure
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          {
            echo "### Plan for \`${{ matrix.env }}\`"
            echo '```'
            tail -n 200 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
          PLAN_DIR: envs/${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`${process.env.PLAN_DIR}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(-60000);
            const body = `#### Terraform plan: \`${process.env.ENV_NAME}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Save the EXACT plan so apply runs what was reviewed, nothing more.
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: envs/${{ matrix.env }}/tfplan
          retention-days: 5

  apply-dev:
    name: Apply dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: envs/dev
      - name: Write backend.hcl
        working-directory: .
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ secrets.TF_STATE_BUCKET }}"
          region       = "${{ env.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF
      - run: terraform init -input=false -backend-config=../../backend.hcl
      - run: terraform apply -input=false tfplan

  apply-prod:
    name: Apply prod
    needs: apply-dev
    runs-on: ubuntu-latest
    # Add "Required reviewers" to the prod environment in GitHub settings
    # and this job will pause until someone approves it.
    environment: prod
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: envs/prod
      - name: Write backend.hcl
        working-directory: .
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ secrets.TF_STATE_BUCKET }}"
          region       = "${{ env.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF
      - run: terraform init -input=false -backend-config=../../backend.hcl
      - run: terraform apply -input=false tfplan
